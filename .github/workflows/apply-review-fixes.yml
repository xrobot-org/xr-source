name: apply-review-fixes

on:
  push:
    branches:
      - feat/source-model-20260918

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply reviewed changes
        run: |
          cat .github/review-fix-payload/* > /tmp/review-fixes.b64
          base64 -d /tmp/review-fixes.b64 > /tmp/review-fixes.tgz
          echo "06b394cfec9aaf254d02dbbf0f8d6f96fad8635449f3a3ee6589339641c04986  /tmp/review-fixes.tgz" | sha256sum -c -
          tar -xzf /tmp/review-fixes.tgz -C .
      - name: Validate changes
        run: |
          python -m pip install -e . pytest
          python -m compileall -q src tests tools
          python tools/check_bilingual_docs.py
          python -m pytest -q
          python - <<'PY'
          import ast
          from pathlib import Path

          errors = []
          for root in ("src", "tests", "tools"):
              for path in Path(root).rglob("*.py"):
                  try:
                      ast.parse(
                          path.read_text(encoding="utf-8"),
                          filename=str(path),
                          feature_version=(3, 8),
                      )
                  except Exception as exc:
                      errors.append((str(path), repr(exc)))
          print(f"py38_syntax_errors={len(errors)}")
          for item in errors:
              print(item)
          if errors:
              raise SystemExit(1)
          PY
          PYTHONPATH=src python tools/benchmark_source_model.py --sizes 10000 100000 --batch-edits 3
      - name: Commit changes
        run: |
          git restore --source=HEAD --staged --worktree .github/workflows
          git rm -r .github/review-fix-payload
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Harden edit and region contracts"
          git push
