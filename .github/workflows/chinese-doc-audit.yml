name: chinese-doc-audit

on:
  push:
    branches:
      - feat/source-model-20260918

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python tools/check_chinese_docs.py --report-only
      - uses: actions/upload-artifact@v4
        with:
          name: xr-source-working-copy
          if-no-files-found: error
          path: |
            README.md
            docs
            pyproject.toml
            MANIFEST.in
            src
            tests
            tools
            .github/workflows/test.yml
