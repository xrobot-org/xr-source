name: apply-builder-batch

on:
  push:
    branches:
      - feat/source-model-20260918

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply builder batching changes
        run: |
          cat .github/builder-batch-payload/* > /tmp/builder-batch.b64
          base64 -d /tmp/builder-batch.b64 > /tmp/builder-batch.tgz
          echo "297bf47974fd1a9fec91790e7d94fb8deefb9bda019487453822376f23bee044  /tmp/builder-batch.tgz" | sha256sum -c -
          tar -xzf /tmp/builder-batch.tgz -C .
      - name: Validate changes
        run: |
          python -m pip install -e . pytest
          python -m compileall -q src tests tools
          python tools/check_bilingual_docs.py
          python -m pytest -q
          python - <<'PY'
          import ast
          from pathlib import Path

          errors = []
          for root in ("src", "tests", "tools"):
              for path in Path(root).rglob("*.py"):
                  try:
                      ast.parse(
                          path.read_text(encoding="utf-8"),
                          filename=str(path),
                          feature_version=(3, 8),
                      )
                  except Exception as exc:
                      errors.append((str(path), repr(exc)))
          print(f"py38_syntax_errors={len(errors)}")
          for item in errors:
              print(item)
          if errors:
              raise SystemExit(1)
          PY
      - name: Commit changes
        run: |
          git restore --source=HEAD --staged --worktree .github/workflows
          git rm -r .github/builder-batch-payload
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Batch builder parsing at document boundary"
          git push
