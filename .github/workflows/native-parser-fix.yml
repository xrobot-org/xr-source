name: native-parser-fix

on:
  push:
    branches:
      - feat/source-model-20260918

permissions:
  contents: read

jobs:
  format-and-diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install development dependencies
        run: python -m pip install -e ".[dev]"
      - name: Format native parser files
        run: |
          python -m ruff format             src/xr_source/cpp/lexer.py             src/xr_source/cpp/_ranges.py             src/xr_source/cpp/_declarator.py             src/xr_source/cpp/_expression.py             src/xr_source/cpp/_declaration.py             src/xr_source/cpp/parser.py             src/xr_source/cpp/grammar/__init__.py             tests/test_cpp_schema.py             tests/test_cpp_grammar_schema.py
          python -m ruff check --fix             src/xr_source/cpp/lexer.py             src/xr_source/cpp/_ranges.py             src/xr_source/cpp/_declarator.py             src/xr_source/cpp/_expression.py             src/xr_source/cpp/_declaration.py             src/xr_source/cpp/parser.py             src/xr_source/cpp/grammar/__init__.py             tests/test_cpp_schema.py             tests/test_cpp_grammar_schema.py || true
      - name: Collect diagnostics
        run: |
          python -m ruff check . > native-parser-ruff.txt 2>&1 || true
          python -m mypy --strict src/xr_source > native-parser-mypy.txt 2>&1 || true
          python -m pytest > native-parser-pytest.txt 2>&1 || true
      - uses: actions/upload-artifact@v4
        with:
          name: native-parser-formatted
          if-no-files-found: error
          path: |
            src/xr_source/cpp
            tests/test_cpp_schema.py
            tests/test_cpp_grammar_schema.py
            native-parser-ruff.txt
            native-parser-mypy.txt
            native-parser-pytest.txt
