name: apply-chinese-docs

on:
  push:
    branches:
      - feat/source-model-20260918

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 应用中文文档与代码说明
        run: |
          cat .github/doc-transfer/* > /tmp/xr-changes.b64
          base64 -d /tmp/xr-changes.b64 > /tmp/xr-changes.tar.gz
          tar -xzf /tmp/xr-changes.tar.gz
          python tools/check_chinese_docs.py
          python -m compileall -q src tests tools
      - name: 提交源码和文档
        run: |
          # GitHub Actions bot 没有 workflows 权限，因此恢复所有 workflow 文件；
          # test.yml 的永久审计和临时 workflow 清理由后续 GitHub API 提交完成。
          git restore --source=HEAD --staged --worktree .github/workflows
          git rm -r .github/doc-transfer
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add Chinese documentation and code comments"
          git push
