name: test

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.12", "3.14"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev,cmake]"
      - run: python -m pytest

  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev,cmake]"
      - run: python -m ruff check src tests tools
      - run: python -m mypy src

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip build twine
      - run: python -m build
      - run: python -m twine check dist/*
      - run: python -m pip install dist/*.whl
      - name: Verify standalone C++ wheel
        run: |
          python - <<'PY'
          import importlib.metadata
          import sys

          from xr_source.cpp import CppDocument

          source = b'#include "a.hpp"\r\nvoid f() { target(1); }\r\n'
          assert CppDocument.parse(source).render_bytes() == source

          requirements = importlib.metadata.requires("xr-source") or []
          assert not any("tree-sitter-cpp" in item.lower() for item in requirements)
          assert "tree_sitter" not in sys.modules
          assert "tree_sitter_cpp" not in sys.modules
          PY
