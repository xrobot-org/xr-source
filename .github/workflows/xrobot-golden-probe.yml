name: xrobot-golden-probe

on:
  push:
    branches:
      - feat/source-model-20260918

permissions:
  contents: read

jobs:
  probe:
    if: github.event.head_commit.message == 'Run XRobot golden probe'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e .
      - run: python -m pip install "git+https://github.com/xrobot-org/XRobot.git@XRobot2.0"
      - name: Clone official module corpus
        run: |
          git clone --depth=1 https://github.com/xrobot-org/xrobot-modules.git /tmp/xrobot-index
          mkdir -p /tmp/xrobot-modules/xrobot-org
          python - <<'PY' >/tmp/module-urls.txt
          import yaml
          from pathlib import Path
          data = yaml.safe_load(Path("/tmp/xrobot-index/index.yaml").read_text())
          for url in data["modules"]:
              print(url)
          PY
          while IFS= read -r url; do
            name="$(basename "${url%.git}")"
            git clone --depth=1 "$url" "/tmp/xrobot-modules/xrobot-org/$name"
          done </tmp/module-urls.txt
      - name: Compare manifest shape with C++ constructors
        run: |
          python - <<'PY'
          import json
          import re
          from pathlib import Path

          from xrobot.ModuleParser import parse_constructor_args, parse_manifest_from_header
          from xr_syntax.cpp import CppDocument

          root = Path("/tmp/xrobot-modules/xrobot-org")
          rows = []
          mismatch = []

          def norm_type(value):
              if value is None:
                  return ""
              return re.sub(r"\s+", "", value)

          for module in sorted(p for p in root.iterdir() if p.is_dir()):
              header = module / f"{module.name}.hpp"
              row = {"module": module.name}
              if not header.exists():
                  row["status"] = "missing-primary-header"
                  mismatch.append(row)
                  rows.append(row)
                  continue
              manifest = parse_manifest_from_header(header)
              if manifest is None:
                  row["status"] = "missing-manifest"
                  mismatch.append(row)
                  rows.append(row)
                  continue

              manifest_args = parse_constructor_args(manifest.constructor_args)
              manifest_templates = parse_constructor_args(manifest.template_args)
              document = CppDocument.parse(header.read_bytes(), source_name=str(header))
              row["diagnostics"] = [item.message for item in document.diagnostics]
              classes = document.class_views(module.name)
              row["class_count"] = len(classes)
              row["manifest_constructor_args"] = list(manifest_args)
              row["manifest_template_args"] = list(manifest_templates)
              if len(classes) != 1:
                  row["status"] = "class-count"
                  mismatch.append(row)
                  rows.append(row)
                  continue

              view = classes[0]
              row["cpp_template_parameters"] = [
                  {"name": item.name, "type": item.type, "default": item.default}
                  for item in view.template_parameters
              ]
              constructors = view.constructors(public_only=True, callable_only=True)
              row["constructors"] = [
                  [
                      {"name": p.name, "type": p.type, "default": p.default}
                      for p in ctor.parameters
                  ]
                  for ctor in constructors
              ]

              candidates = []
              for index, ctor in enumerate(constructors):
                  params = ctor.parameters
                  if len(params) < 2:
                      continue
                  first = norm_type(params[0].type)
                  second = norm_type(params[1].type)
                  if "HardwareContainer" in first and "ApplicationManager" in second:
                      candidates.append((index, len(params) - 2))
              row["application_constructor_candidates"] = candidates

              arg_ok = any(extra == len(manifest_args) for _, extra in candidates)
              template_ok = len(view.template_parameters) == len(manifest_templates)
              row["constructor_count_match"] = arg_ok
              row["template_count_match"] = template_ok
              row["status"] = "match" if arg_ok and template_ok else "mismatch"
              if row["status"] != "match":
                  mismatch.append(row)
              rows.append(row)

          result = {
              "modules": len(rows),
              "matches": sum(r["status"] == "match" for r in rows),
              "mismatches": len(mismatch),
              "rows": rows,
              "mismatch_rows": mismatch,
          }
          Path("xrobot-golden.json").write_text(json.dumps(result, indent=2), encoding="utf-8")
          print(f"modules={result['modules']} matches={result['matches']} mismatches={result['mismatches']}")
          for row in mismatch:
              print("MISMATCH", row["module"], row["status"])
              print(json.dumps(row, ensure_ascii=False, indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: xrobot-golden
          path: xrobot-golden.json
