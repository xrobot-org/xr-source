name: apply-xr-syntax-rework

on:
  push:
    branches:
      - feat/source-model-20260918

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply rework
        run: |
          python .github/xr-syntax-rework/apply.py
          cp .github/xr-syntax-rework/README.md README.md
          cp .github/xr-syntax-rework/ARCHITECTURE.md docs/ARCHITECTURE.md
          cp .github/xr-syntax-rework/REVIEW_GUIDE.md docs/REVIEW_GUIDE.md
          cp .github/xr-syntax-rework/ROADMAP.md docs/ROADMAP.md
          cp .github/xr-syntax-rework/VALIDATION.md docs/VALIDATION.md
          cp .github/xr-syntax-rework/pyproject.toml pyproject.toml
          cp .github/xr-syntax-rework/cmake_parser.py src/xr_syntax/cmake/parser.py
          cp .github/xr-syntax-rework/cmake_grammar_init.py src/xr_syntax/cmake/grammar/__init__.py
          cp .github/xr-syntax-rework/test_cmake.py tests/test_cmake.py
          cp .github/xr-syntax-rework/check_bilingual_docs.py tools/check_bilingual_docs.py
      - name: Validate rework
        run: |
          python -m pip install -e . pytest
          python -m compileall -q src tests tools
          python tools/check_bilingual_docs.py
          python -m pytest -q
          python - <<'PY'
          import ast
          from pathlib import Path

          errors = []
          for root in ("src", "tests", "tools"):
              for path in Path(root).rglob("*.py"):
                  try:
                      ast.parse(path.read_text(encoding="utf-8"), filename=str(path), feature_version=(3, 8))
                  except Exception as exc:
                      errors.append((str(path), repr(exc)))
          print(f"py38_syntax_errors={len(errors)}")
          for item in errors:
              print(item)
          if errors:
              raise SystemExit(1)
          PY
          if grep -R -n -E 'tree_sitter_language_pack|tree-sitter-language-pack|slots=True|TypeAlias|removesuffix\(|strict=False|importlib\.resources\.files|# EN:|Describe this' src tests tools pyproject.toml; then
            echo "Found stale compatibility/documentation patterns"
            exit 1
          fi
      - name: Commit rework
        run: |
          git restore --source=HEAD --staged --worktree .github/workflows
          git rm -r .github/xr-syntax-rework
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Rework package structure and documentation"
          git push
